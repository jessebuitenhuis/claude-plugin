$schema: "https://json-schema.org/draft/2020-12/schema"
title: Domain Spec
description: >
  Behavioral spec for a bounded context in the event-sourced domain abstraction.
  Behavior only — no implementation choices.
type: object
required: [context]
properties:
  context:
    $ref: "#/$defs/context"

$defs:
  context:
    type: object
    required: [name, description, aggregates]
    additionalProperties: false
    properties:
      name:
        description: Short PascalCase identifier for the bounded context (e.g. WorkManagement, Billing).
        type: string
      description:
        description: One or two sentences on what this context is responsible for and why it exists.
        type: string
      workflows:
        description: Cross-aggregate or cross-context flows that coordinate behavior without owning state.
        type: array
        items:
          $ref: "#/$defs/workflow"
      aggregates:
        description: The consistency boundaries that own state and enforce invariants in this context.
        type: array
        items:
          $ref: "#/$defs/aggregate"

  workflow:
    type: object
    required: [name, description, behavior]
    additionalProperties: false
    properties:
      name:
        description: Short camelCase or PascalCase name for the workflow (e.g. dependency, escalation).
        type: string
      description:
        description: What this workflow coordinates and why it needs to exist above the aggregate level.
        type: string
      behavior:
        description: Acceptance scenarios (given/when/then) that fully specify the workflow's observable behavior.
        type: array
        items:
          type: object
          required: [given, when, then]
          additionalProperties: false
          properties:
            given:
              description: The pre-condition or starting state for this scenario.
              type: string
            when:
              description: The event or command that triggers the workflow step.
              type: string
            then:
              description: The observable outcome that must follow.
              type: string

  aggregate:
    type: object
    required: [name, purpose, invariants, initial_state, states, transitions, operations]
    additionalProperties: false
    properties:
      name:
        description: Short PascalCase identifier for the aggregate (e.g. WorkItem, Invoice).
        type: string
      purpose:
        description: One sentence on what this aggregate is responsible for protecting — its core business rule.
        type: string
      invariants:
        description: Rules that must always hold regardless of which operation ran. Express as plain-English assertions.
        type: array
        items:
          type: string
      initial_state:
        description: >
          The state the aggregate starts in before any commands are applied.
          Use null when the aggregate does not exist until explicitly created.
        oneOf:
          - type: "null"
          - type: string
      states:
        description: All named states the aggregate can be in. Each state has a name and a business meaning.
        type: array
        items:
          $ref: "#/$defs/state"
      transitions:
        description: Allowed state changes. Only transitions listed here are legal — anything else is implicitly forbidden.
        type: array
        items:
          $ref: "#/$defs/transition"
      operations:
        description: Commands this aggregate can handle, each with its preconditions, events emitted, and resulting state.
        type: array
        items:
          $ref: "#/$defs/operation"

  state:
    type: object
    required: [name, meaning]
    additionalProperties: false
    properties:
      name:
        description: Unique identifier for this state within the aggregate (e.g. open, closed, cancelled).
        type: string
      meaning:
        description: What it means for the aggregate to be in this state — the business significance, not the mechanics.
        type: string
      data:
        description: Fields that exist on the aggregate while it is in this state.
        type: array
        items:
          $ref: "#/$defs/dataField"

  transition:
    type: object
    required: [from, to, description]
    additionalProperties: false
    properties:
      from:
        description: The source state(s) this transition starts from.
        $ref: "#/$defs/stateRef"
      excludes:
        description: States to subtract when 'from' is 'any'. Lists the states this transition may NOT start from.
        type: array
        items:
          type: string
      to:
        description: The target state this transition leads to.
        $ref: "#/$defs/stateRef"
      description:
        description: Why this transition exists — the business event or decision that causes it.
        type: string

  operation:
    description: >
      'validFrom' and 'excludes' express state legality — which states the
      operation may run from. 'guards' express runtime data conditions that
      must hold beyond state legality. Keep these distinct: state checks belong
      in 'validFrom'/'excludes', data checks belong in 'guards'.
    type: object
    required: [name, intent, validFrom, command, events, transitionsTo]
    additionalProperties: false
    properties:
      name:
        description: Short camelCase identifier for the operation (e.g. complete, assignTo, reopen).
        type: string
      intent:
        description: One sentence describing the business intent — what the user or system is trying to achieve.
        type: string
      validFrom:
        $ref: "#/$defs/validFrom"
      excludes:
        description: "Only meaningful with 'validFrom: any' — subtracts specific states from the full set."
        type: array
        items:
          type: string
      guards:
        description: Runtime data conditions checked after state legality. Use only for data-driven rules, not state checks.
        type: array
        items:
          type: object
          required: [condition]
          additionalProperties: false
          properties:
            condition:
              description: Plain-English assertion that must be true for the operation to proceed (e.g. "assignee exists").
              type: string
      command:
        $ref: "#/$defs/commandRef"
      events:
        $ref: "#/$defs/eventList"
      transitionsTo:
        description: >
          Target state after the operation. Use a named state, or 'none' if the
          operation records a fact without changing state.
        type: string

  validFrom:
    description: >
      'null' = item must not exist yet (creation only).
      'any' = any existing state; combine with top-level 'excludes' to restrict.
      A string or list of strings = specific named states.
    oneOf:
      - type: "null"
      - type: string
      - type: array
        items:
          type: string

  commandRef:
    description: >
      Use a bare string when the command carries no payload beyond the implied
      aggregate id. Use an object with 'name' and 'data' when it carries
      additional fields.
    oneOf:
      - type: string
      - type: object
        required: [name]
        additionalProperties: false
        properties:
          name:
            description: Name of the command (e.g. CompleteWorkItem, AssignTo).
            type: string
          data:
            description: Payload fields the command carries beyond the aggregate id.
            type: array
            items:
              $ref: "#/$defs/dataField"

  eventList:
    description: >
      A list of events. Use bare strings when events carry no payload. Use
      objects with 'name' (and optionally 'data' and 'note') when they do.
      Both forms may appear in the same list.
    type: array
    items:
      $ref: "#/$defs/eventRef"

  eventRef:
    description: >
      Events are thin — they carry the delta (what changed), not the full
      resulting state. The evolver is responsible for carrying unchanged state
      forward. Use a bare string when the event carries no payload beyond the
      implied aggregate id. Use an object with 'name' when it carries
      additional fields or a note.
    oneOf:
      - type: string
      - type: object
        required: [name]
        additionalProperties: false
        properties:
          name:
            description: Name of the event in past tense (e.g. WorkItemCompleted, AssigneeChanged).
            type: string
          data:
            description: Fields carried by this event — only the delta, not the full state.
            type: array
            items:
              $ref: "#/$defs/dataField"
          note:
            description: Optional clarification about why this event exists or what makes it distinct.
            type: string

  dataField:
    description: >
      Use a bare string when the field name is self-explanatory. Use a
      single-key object { fieldName: 'description' } when the field needs
      clarification.
    oneOf:
      - type: string
      - type: object
        minProperties: 1
        maxProperties: 1

  stateRef:
    description: A state name, a list of state names, or 'any' to mean all states.
    oneOf:
      - type: string
      - type: array
        items:
          type: string
